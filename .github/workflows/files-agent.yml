name: Files.com Agent

on:
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Download files-agent
        run: |
          curl -fsSL -o files-agent.tar.gz "https://files.com/api/download/agent?platform=linux&architecture=amd64"
          tar xzf files-agent.tar.gz
          chmod +x files-agent

      - name: Write config file
        run: echo "${{ secrets.FILES_AGENT_CONFIG }}" | base64 -d > files_agent_config.toml

      - name: Start agent
        run: ./files-agent start --config files_agent_config.toml
